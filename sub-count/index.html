<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subscriber Count Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }

  .wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 24px;
    width: fit-content;
  }

  .logo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    /* fallback ring in case the logo image fails to load */
    background: rgba(255,255,255,0.15);
  }

  .text-block {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .label {
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.9);
  }

  .count-wrap {
    position: relative;
    display: inline-block;
    height: 33px;
    min-width: 60px;
    overflow: hidden;
  }

  .count {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.9);
    white-space: nowrap;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
  }

  .count.loading {
    opacity: 0.5;
    position: static;
  }
</style>
</head>
<body>

<div class="wrap">
  <img class="logo" id="logo" alt="">
  <div class="text-block">
    <span class="label">Subscribers:</span>
    <div class="count-wrap" id="countWrap">
      <span class="count loading" id="count">···</span>
    </div>
  </div>
</div>

<script>
  // ===== CONFIG — fill these in =====
  const API_KEY = "AIzaSyCEdgw4GXGwWyzP9iQqIHTsxrKaZiqry4k";
  const CHANNEL_ID = "UCxP5eJLTMjn24M73tqOW2Xw"; // starts with UC...
  const REFRESH_SECONDS = 12; // how often to poll for new count
  // ===================================

  const countWrap = document.getElementById('countWrap');
  const logoEl = document.getElementById('logo');
  let logoLoaded = false;
  let lastRawCount = null;
  let firstLoad = true;

  function formatCount(n) {
    n = parseInt(n, 10);
    if (n >= 1000000) return (n / 1000000).toFixed(2).replace(/\.00$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return n.toString();
  }

  function renderCount(rawCount) {
    const text = formatCount(rawCount);
    const oldEl = document.getElementById('count');

    // First load: just place the number, no slide.
    if (firstLoad) {
      oldEl.textContent = text;
      oldEl.classList.remove('loading');
      oldEl.style.position = 'absolute';
      firstLoad = false;
      return;
    }

    // No change since last check — nothing to animate.
    if (rawCount === lastRawCount) return;

    const increased = rawCount > lastRawCount;

    const newEl = document.createElement('span');
    newEl.className = 'count';
    newEl.id = 'count';
    newEl.textContent = text;
    // New number starts off-screen: below if going up, above if going down.
    newEl.style.transform = increased ? 'translateY(100%)' : 'translateY(-100%)';
    countWrap.appendChild(newEl);

    // Force layout, then animate both old and new into place.
    requestAnimationFrame(() => {
      oldEl.style.transform = increased ? 'translateY(-100%)' : 'translateY(100%)';
      oldEl.style.opacity = '0';
      newEl.style.transform = 'translateY(0)';
    });

    setTimeout(() => oldEl.remove(), 420);
  }

  async function fetchSubs() {
    try {
      const url = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${CHANNEL_ID}&key=${API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.items && data.items.length > 0) {
        const item = data.items[0];
        const rawCount = parseInt(item.statistics.subscriberCount, 10);
        renderCount(rawCount);
        lastRawCount = rawCount;

        // Set the channel's real profile picture as the logo,
        // only once — no need to keep re-fetching the image itself.
        if (!logoLoaded && item.snippet && item.snippet.thumbnails) {
          const thumb = item.snippet.thumbnails.high || item.snippet.thumbnails.default;
          logoEl.src = thumb.url;
          logoLoaded = true;
        }
      } else {
        document.getElementById('count').textContent = "ERR";
      }
    } catch (e) {
      document.getElementById('count').textContent = "ERR";
    }
  }

  fetchSubs();
  setInterval(fetchSubs, REFRESH_SECONDS * 1000);
</script>

</body>
</html>
